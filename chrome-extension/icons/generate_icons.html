<!DOCTYPE html>
<!--
  Open this file in a browser, then right-click each canvas → Save Image As
  to get icon16.png, icon48.png, icon128.png.
  Place the saved files in this icons/ folder.
-->
<html>
<body style="background:#111;display:flex;gap:24px;padding:24px;align-items:flex-end">
<script>
  [16, 48, 128].forEach(size => {
    const canvas = document.createElement("canvas");
    canvas.width = canvas.height = size;
    canvas.title = `icon${size}.png – right-click → Save Image As`;
    canvas.style.imageRendering = "pixelated";
    canvas.style.cursor = "pointer";

    const ctx = canvas.getContext("2d");
    const r = size * 0.14;

    // Background
    ctx.fillStyle = "#1a1a1a";
    ctx.beginPath();
    ctx.roundRect(0, 0, size, size, r);
    ctx.fill();

    // "LC" text
    ctx.fillStyle = "#ffa116";
    ctx.font = `bold ${size * 0.42}px -apple-system,sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("LC", size / 2, size / 2);

    document.body.appendChild(canvas);

    const label = document.createElement("div");
    label.textContent = `${size}×${size}`;
    label.style.cssText = "color:#666;font:11px sans-serif;text-align:center;margin-top:4px";
    const wrap = document.createElement("div");
    wrap.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:6px";
    canvas.replaceWith(wrap);
    wrap.appendChild(canvas);
    wrap.appendChild(label);
  });
</script>
</body>
</html>
